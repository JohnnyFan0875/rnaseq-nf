# ──────────────────────────────────────────────────────────────────────────────
# params/<project_name>.yaml  —  Nextflow params-file template
#
# Usage:
#   nextflow run main.nf -profile docker -params-file params/my_project.yaml
# ──────────────────────────────────────────────────────────────────────────────

# === Project ===
project_name: test # Used to locate data/my_project/
outdir: data/test/results # All pipeline outputs go here
metadata_file: data/test/metadata/sample_metadata.csv # Sample metadata file

# === Comparisons ===
comparisons:
  - name: dex_vs_untreated # Label used in output files & plots
    control: untreated # Group name in metadata 'group' column
    non_control: dex # Group name in metadata 'group' column

# === Reference ===
ref_dir: reference # defaults to <pipeline>/reference
reference_auto_download: true # if required files are missing, download / generate them automatically

# === Quantification ===
quant_strategy: salmon
kallisto_threads: 4
salmon_threads: 4

# === Differential expression ===
de_method: edgeR # edgeR | DESeq2

# === Enrichment analysis ===
organism: human # human | mouse  (passed to gsea/ora scripts)

# === Optional flags ===
# save_trimmed:    false
# skip_trimming:   false
skip_enrichment: true
# min_trimmed_reads: 1000000
