# ──────────────────────────────────────────────────────────────────────────────
# params/<project_name>.yaml  —  Nextflow params-file template
#
# Usage:
#   nextflow run main.nf -profile docker -params-file params/my_project.yaml
# ──────────────────────────────────────────────────────────────────────────────

# === Required ===
project_name: my_project                              # Used to locate data/my_project/
outdir: results/my_project                            # All pipeline outputs go here
metadata_file: ./data/my_project/metadata/sample_metadata.csv

# === Input ===
# metadata_file is required

# === Comparisons (required) ===
comparisons:
  - name: treatment_vs_control                        # Label used in output files & plots
    control: control                                  # Group name in metadata 'group' column
    non_control: treatment                            # Group name in metadata 'group' column

# === Reference ===
# ref_dir: ./reference                                # defaults to <pipeline>/reference
# reference_auto_download: true                       # if required files are missing, download / generate them automatically

# === Quantification ===
quant_strategy: kallisto                              # kallisto | salmon
kallisto_threads: 4
salmon_threads: 4

# === Differential expression ===
de_method: edgeR                                      # edgeR | DESeq2

# === Enrichment analysis ===
organism: human                                       # human | mouse  (passed to gsea/ora scripts)

# === Optional flags ===
# save_trimmed:    false
# skip_trimming:   false
# skip_enrichment: false
# min_trimmed_reads: 1000000
